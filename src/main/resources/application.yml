spring:
  application:
    name: pullit-backend
    
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
    
  # Multipart 파일 업로드 설정
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 2KB
    
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
        
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 60000ms
      lettuce:
        pool:
          enabled: true
          max-active: 10
          max-idle: 10
          min-idle: 5
  cache:
    type: redis
    redis:
      time-to-live: 360000

# PDF Processing Configuration
app:
  pdf:
    image-dpi: 300  # PDF를 이미지로 변환할 때의 DPI (해상도)
    image-format: png  # 변환할 이미지 형식 (png, jpg 등)
  security:
    oauth2:
      resourceserver:
        jwt:
          jws -algorithms: RS256
          public-key-location: classpath:keys/public-key.pem
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: post
            redirect-uri: "{baseUrl}/api/auth/oauth2/kakao/callback"
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              # - account_email  # 권한이 없어서 주석 처리
            client-name: Kakao
          naver:
            client-id: ${NAVER_CLIENT_ID:}
            client-secret: ${NAVER_CLIENT_SECRET:}
            client-authentication-method: post
            redirect-uri: "{baseUrl}/api/auth/oauth2/naver/callback"
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
  cloud:
    aws:
      region:
        static: ap-northeast-2

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

# SpringDoc OpenAPI 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    # Multipart 파일 업로드 지원 설정
    default-consumes-media-type: application/json
    default-produces-media-type: application/json
  # 파일 업로드 크기 제한 설정 (Swagger UI에서도 적용)
  paths-to-match:
    - /**

# Security 설정
security:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174
      - http://localhost:5175
      - http://localhost:3000
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600

logging:
  level:
    root: INFO
    com.pullit: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.querydsl.sql: DEBUG
    com.querydsl.jpa: DEBUG
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/pullit.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
jwt:
  issuer: pullit
  access-token-expiration: 86400  # 24시간 (초)
  refresh-token-expiration: 604800 # 7일 (초)
  private-key-location: classpath:keys/private-key.pem

aws:
  s3:
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    bucket-name: pullit-frontend-20250805
    region: ap-northeast-2
    default-presigned-url-expiry: 60  # 분 단위
    max-file-size: 100  # MB 단위
    directories:
      pdf: pdfs/
      image: images/
      excel: excels/
      temp: temp/
      profile: profiles/

ocr:
  clova:
    invoke-url: ${CLOVA_INVOKE_URL}
    secret-key: ${CLOVA_SECRET_KEY}
    header-name: "X-OCR-SECRET"
  mathpix:
    url: ${MATHPIX_APP_URL}
    app-id: ${MATHPIX_APP_ID}
    app-key: ${MATHPIX_APP_KEY}
    app-id-header-name: "app_id"
    header-name: "app_key"

