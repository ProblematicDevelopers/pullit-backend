spring:
  # Production Database Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
    
  # JPA Production Settings
  jpa:
    hibernate:
      ddl-auto: validate  # Never auto-create/update in production
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        
  # Redis Production Configuration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 60000ms
      lettuce:
        pool:
          enabled: true
          max-active: 20
          max-idle: 10
          min-idle: 5

  # Elasticsearch Configuration
  elasticsearch:
    uris: ${ES_HOSTS:http://localhost:9200}

# Production Security Settings
security:
  cors:
    # Production domains only - no localhost
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - X-Requested-With
      - Accept
      - Origin
    allow-credentials: true
    max-age: 3600

# JWT Production Settings
jwt:
  issuer: pullit-production
  access-token-expiration: 3600  # 1시간 (초)
  refresh-token-expiration: 2592000  # 30일 (초)
  private-key-location: classpath:keys/private-key.pem
  public-key-location: classpath:keys/public-key.pem

# Production Logging Configuration
logging:
  level:
    root: WARN
    com.pullit: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
    org.springframework.web.cors: DEBUG  # CORS 디버깅용 (필요시 제거)
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/pullit/pullit.log
    max-size: 100MB
    max-history: 30

# SpringDoc/Swagger - Disable in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Server Configuration
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# Management endpoints for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true